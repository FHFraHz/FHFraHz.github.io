<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road trip</title>
</head>
<body>
<style>
    body {
        width: 100vw;
        width: 100svw;
        height: 100vh;
        height: 100svh;
        margin: 0;
        padding: 0;
    }

    .scene-container {
        width: 100%;
        height: 100%;
        position: relative;
        --perspective-setting: 25em;
        perspective: var(--perspective-setting);
        perspective-origin: 60% 43%;    
        /* perspective-origin: top right; */
        
        overflow: hidden;
        background-color: #0015;
        background-image: radial-gradient(ellipse at top right, #FED3, #0111);

        .scene > * {
            position: absolute;
            /* outline: lime 1px solid; */
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: var(--perspective-font-size);
            transform-style: preserve-3d;
            background: linear-gradient(to top, green 0%, darkgreen 25%, skyblue 50%, dodgerblue 100%);
            transform: rotateY(-10deg);
            --road-width: 3em;
            --car-width: calc(var(--road-width) * 0.37);
            --car-height: calc(var(--car-width) * 0.62);
            --car-length: calc(var(--car-width) * 1);
            --car-speed: 0.2s;

            .grass {
                position: absolute;
                width: 100%;
                height: 100%;
                background: linear-gradient(to top, green, darkgreen);
                transform: rotateX(90deg);
                overflow: hidden;

                .road {
                    position: absolute;
                    width: var(--road-width);
                    top: 0%;
                    height: 125%;
                    left: 52%;
                    background:
                    linear-gradient(to left, #333 0%, #333 47.99999999%, #0000 48%, #0000 52%, #333 52.11111111%),
                    repeating-linear-gradient(to top, #feee 0%, #feee 4.99999999%, #333 5%, #333 9.99999999%)
                    ;
                    animation: anim-road-progress calc(var(--car-speed) * 2) linear infinite;
                    /* background-size: 0.5em; */
                    /* background-repeat: repeat; */
                }

                
            }
            
            .car {
                
                transform-style: preserve-3d;
                width: var(--car-width);
                height: var(--car-height);
                /* background: red; */
                top: calc(50% - var(--car-height));
                left: 54%;
                transform: translateZ(calc(var(--perspective-setting) * 0.1));
                
                .side {
                    position: absolute;
                    background: #C00A;
                    bottom: 0.075em;
                }
                .side.front, .side.back {
                    width: var(--car-width);
                    height: var(--car-height);
                }
                .side.left, .side.right {
                    width: var(--car-length);
                    height: var(--car-height);
                    clip-path: polygon(0% 50%, 10% 50%, 12% 55%, 20% 55%, 30% 52%, 70% 52%, 94% 58%, 100% 66%, 100% 100%, 0% 100%);
                }
                .side.front { transform: translateZ(calc(var(--car-length) * 0.5)); clip-path: polygon(0% 66%, 100% 66%, 100% 110%, 0% 110%); }
                .side.back { transform: translateZ(calc(var(--car-length) * -0.5)) rotateY(180deg); clip-path: polygon(0% 50%, 100% 50%, 100% 100%, 0% 100%); }
                .side.left { transform: translateX(calc(0em - var(--car-width) / 2 + 1px)) rotateY(270deg); }
                .side.right { transform: translateX(calc(var(--car-width) / 2 - 1px)) rotateY(90deg) scaleX(-100%); }

                .side .bumper {
                    position: absolute;
                    width: 100%;
                    height: 6%;
                    bottom: 0%;
                    left: 0%;
                    background: linear-gradient(to bottom, #822f, #a66c, #822f);
                }

                .side .license-plate {
                    position: absolute;
                    left: 40%;
                    width: 20%;
                    height: 10%;
                    border-radius: 1px;
                    outline: inset #7af 1px;
                    background:
                    linear-gradient(to bottom, blue 0%, dodgerblue 15%, #fcfcfc 15.0000000001%)
                    ;
                    filter: drop-shadow(0px 0px 1px #1119);
                    
                    p {
                        margin: 0;
                        padding: 2px 0 0 0;
                        color: black;
                        font-size: 3px;
                        text-align: center;
                        font-family: sans-serif;
                    }
                }
                .side.front .license-plate { bottom: -2%; }
                .side.back .license-plate { bottom: 3%; }

                /* LIGHTS lol */
                .side.front::after, .side.front::before {
                    content: '';
                    position: absolute;
                }
                .side.front::before {
                    width: 90%;
                    height: 20%;
                    bottom: 7%;
                    left: 5%;
                    background:
                        linear-gradient(to top, #1115 0%, #0000 33.3333333333%, #0000 66.6666666666%, #1115 100%),
                        linear-gradient(to left, lightyellow 0%, whitesmoke 10%, lightyellow 20%, #0000 20.0000000001%, #0000 79.999999999%, lightyellow 80%, whitesmoke 90%, lightyellow 100%),
                        repeating-linear-gradient(to top, lightsteelblue 0%, slategray 15%)
                    ;
                    border-radius: 4px 4px 2px 2px;
                    clip-path: polygon(0% 0%, 20% 0%, 20% 7%, 80% 7%, 80% 0%, 100% 0%, 100% 100%, 80% 100%, 80% 95%, 20% 95%, 20% 100%, 0% 100%);
                }
                .side.front::after {
                    width: 90%;
                    height: 4%;
                    bottom: 7%;
                    left: 5%;
                    border-radius: 8px 8px 4px 4px;
                    background:
                        /* linear-gradient(to top, #1115 0%, #0000 33.3333333333%, #0000 66.6666666666%, #1115 100%), */
                        linear-gradient(to left, #1114 0%, #1114 20%, #0000 20.0000000001%, #0000 79.9999999999%, #1114 80%, #1114 100%),
                        linear-gradient(to left, #fe09 0%, lightyellow 10%, #fe07 20%, #0000 20.0000000001%, #0000 79.9999999999%, #fe07 80%, lightyellow 90%, #fe09 100%)
                        ;
                }  

                .wheels {
                    position: absolute;
                    transform-style: preserve-3d;
                    --wheel-diameter: calc(var(--car-height) * 0.3);
                    --wheel-pair-width: calc(var(--car-width) * 1.1);
                    width: var(--wheel-pair-width);
                    height: var(--wheel-diameter);
                    left: calc(calc(var(--wheel-pair-width) - var(--car-width)) * -0.5);
                    bottom: 0;
                    /* transform: rotateX(90deg); */
                    /* outline: lime 1px solid; */
                    --side-count: inherit;

                    .front, .rear {
                        position: absolute;
                        bottom: 0;
                        width: 100%;
                        height: 100%;
                        transform-style: preserve-3d;
                    }
                    .front {
                        transform: translateZ(calc(var(--car-length) * 0.3));
                    }
                    .rear {
                        transform: translateZ(calc(var(--car-length) * -0.2));
                    }

                    .wheel-pair {
                        position: absolute;
                        transform-style: preserve-3d;
                        width: 100%;
                        height: 100%;
                        .side {
                            
                            --side-i: inherit;
                            background: linear-gradient(to left, #444 0%, #111 25%, #0000 25.0000000001%, #0000 74.9999999999%, #111 75%, #444 100%);
                            /* background: hsl(calc(255 * var(--side-i) / var(--side-count)), 50%, 50%); */
                            width: 100%;
                            /* height: 100%; */
                            height: calc(var(--wheel-diameter) / var(--side-count) * 4.75);
                            top: calc(var(--wheel-diameter) * 0.375);
                            transform:
                                rotateX(calc(360deg * var(--side-i) / var(--side-count)))
                                translateZ(calc(var(--wheel-diameter) * 0.5))
                                /* translateY(calc(var(--wheel-diameter) * 0.5)) */
                            ;
                        }
                        animation: wheel-speen var(--car-speed) linear infinite reverse;
                    }

                    .wheel-pair::after, .wheel-pair::before {
                        content: '';
                        position: absolute;
                        width: var(--wheel-diameter);
                        height: var(--wheel-diameter);
                        background:
                            radial-gradient(circle at center, #0000 0%, #0000 36.9999999999%, #333 37%, #111 100%),
                            repeating-conic-gradient(from 45deg, slategray 0%, lightsteelblue 50%)
                        ;
                        border-radius: 50%;
                        top: 0;
                    }
                    .wheel-pair::after {
                        right: 0;
                        transform: rotateY(90deg) translateZ(calc(var(--wheel-diameter) * 0.5));
                    }
                    .wheel-pair::before {
                        left: 0;
                        transform: rotateY(90deg) translateZ(calc(var(--wheel-diameter) * -0.5));
                    }
                }
                
            }
        }
        
    }
    @keyframes anim-road-progress {
        0% { top: 0%; }
        100% { top: -25%; }
    }

    @keyframes wheel-speen {
        0% { transform: rotateX(0deg); }
        100% { transform: rotateX(360deg); }
    }
</style>

<div class="scene-container" style="--perspective-font-size: 96px">
    <div class="scene">
        <div class="grass">
                <div class="road"></div>
            </div>
            
            <div class="car">
                <div class="side front">
                    <div class="bumper"></div>
                    <div class="license-plate">
                        <p>AB 123 CD</p>
                    </div>
                </div>
                <div class="side back">
                    <div class="bumper"></div>
                    <div class="license-plate">
                        <p>AB 123 CD</p>
                    </div>
                </div>
                <div class="side left"></div>
                <div class="side right"></div>
                <div class="body">
                    <div class="hood">
                        <div class="lip">
                            <div class="curve font"></div>
                            <div class="curve middle"></div>
                            <div class="curve back"></div>
                        </div>
                        <div class="lid"></div>
                    </div>
                    <div class="windows"></div>
                    <div class="roof"></div>
                </div>
                <div class="wheels" style="--side-count: 16">
                    <div class="front">
                        <div class="wheel-pair">
                            <div class="side" style="--side-i: 1"></div>
                            <div class="side" style="--side-i: 2"></div>
                            <div class="side" style="--side-i: 3"></div>
                            <div class="side" style="--side-i: 4"></div>
                            <div class="side" style="--side-i: 5"></div>
                            <div class="side" style="--side-i: 6"></div>
                            <div class="side" style="--side-i: 7"></div>
                            <div class="side" style="--side-i: 8"></div>
                            <div class="side" style="--side-i: 9"></div>
                            <div class="side" style="--side-i: 10"></div>
                            <div class="side" style="--side-i: 11"></div>
                            <div class="side" style="--side-i: 12"></div>
                            <div class="side" style="--side-i: 13"></div>
                            <div class="side" style="--side-i: 14"></div>
                            <div class="side" style="--side-i: 15"></div>
                            <div class="side" style="--side-i: 16"></div>
                        </div>
                    </div>
                    <div class="rear">
                        <div class="wheel-pair">
                            <div class="side" style="--side-i: 1"></div>
                            <div class="side" style="--side-i: 2"></div>
                            <div class="side" style="--side-i: 3"></div>
                            <div class="side" style="--side-i: 4"></div>
                            <div class="side" style="--side-i: 5"></div>
                            <div class="side" style="--side-i: 6"></div>
                            <div class="side" style="--side-i: 7"></div>
                            <div class="side" style="--side-i: 8"></div>
                            <div class="side" style="--side-i: 9"></div>
                            <div class="side" style="--side-i: 10"></div>
                            <div class="side" style="--side-i: 11"></div>
                            <div class="side" style="--side-i: 12"></div>
                            <div class="side" style="--side-i: 13"></div>
                            <div class="side" style="--side-i: 14"></div>
                            <div class="side" style="--side-i: 15"></div>
                            <div class="side" style="--side-i: 16"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
