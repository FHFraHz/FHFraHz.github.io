<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road trip</title>
</head>
<body>
<style>
    body {
        width: 100vw;
        width: 100svw;
        height: 100vh;
        height: 100svh;
        margin: 0;
        padding: 0;
    }

    .scene-container {
        width: 100%;
        height: 100%;
        position: relative;
        --perspective-setting: 25em;
        perspective: var(--perspective-setting);
        perspective-origin: 60% 43%;    
        /* perspective-origin: top right; */
        
        overflow: hidden;
        background-color: #0015;
        background-image: radial-gradient(ellipse at top right, #FED3, #0111);

        .scene > * {
            position: absolute;
            /* outline: lime 1px solid; */
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: var(--perspective-font-size);
            transform-style: preserve-3d;
            background: linear-gradient(to top, green 0%, darkgreen 25%, skyblue 50%, dodgerblue 100%);
            transform: rotateY(-10deg);
            --road-width: 3em;
            --car-width: calc(var(--road-width) * 0.37);
            --car-height: calc(var(--car-width) * 0.75);
            --car-length: calc(var(--car-width) * 1);
            --car-speed: 0.12s;

            .grass {
                position: absolute;
                width: 100%;
                height: 100%;
                background: linear-gradient(to top, green, darkgreen);
                transform: rotateX(90deg);
                overflow: hidden;

                .road {
                    position: absolute;
                    width: var(--road-width);
                    top: 0%;
                    height: 125%;
                    left: 52%;
                    background:
                    linear-gradient(to left, #333 0%, #333 47.99999999%, #0000 48%, #0000 52%, #333 52.11111111%),
                    repeating-linear-gradient(to top, #feee 0%, #feee 4.99999999%, #333 5%, #333 9.99999999%)
                    ;
                    animation: anim-road-progress 1s linear infinite;
                    /* background-size: 0.5em; */
                    /* background-repeat: repeat; */
                }

                
            }
            
            .car {
                
                transform-style: preserve-3d;
                width: var(--car-width);
                height: var(--car-height);
                /* background: red; */
                top: calc(50% - var(--car-height));
                left: 54%;
                transform: translateZ(calc(var(--perspective-setting) * 0.1));
                
                .front, .back, .side.left, .side.right {
                    position: absolute;
                    background: #C007;
                }
                .front, .back {
                    width: var(--car-width);
                    height: var(--car-height);
                }
                .side.left, .side.right {
                    width: var(--car-length);
                    height: var(--car-height);
                }
                .front { transform: translateZ(calc(var(--car-length) * 0.5)); }
                .back { transform: translateZ(calc(var(--car-length) * -0.5)); }
                .side.left { transform: translateX(calc(0em - var(--car-width) / 2 + 1px)) rotateY(270deg); }
                .side.right { transform: translateX(calc(var(--car-width) / 2 - 1px)) rotateY(90deg); }
                
            }
        }
        
    }
    @keyframes anim-road-progress {
        0% {
            top: 0%;
        }
        100% {
            top: -25%;
        }
    }
</style>

<div class="scene-container" style="--perspective-font-size: 96px">
    <div class="scene">
        <div class="grass">
                <div class="road"></div>
            </div>
            <div class="car">
                <div class="front"></div>
                <div class="back"></div>
                <div class="side left"></div>
                <div class="side right"></div>
            </div>
        </div>
    </div>
</body>
</html>
