<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            height: 100vh;
            height: 100svh;
            width: 100vw;
            width: 100svw;
            padding: 0;
            margin: 0;
        }
        .scene-container {
            --scene-container-font-size: 96px;
            --scene-container-perspective: 10em;
            --scene-speen-animation-duration: 30s;
            font-size: var(--scene-container-font-size);
            perspective: var(--scene-container-perspective);
            perspective-origin: top center;
            width: 100%;
            height: 100%;
            background: #7777;
            overflow: hidden;
        }
        /* .scene * {
            position: absolute;
        } */
        .scene {
            transform-style: preserve-3d;
            transform-origin: center;
            width: 100%;
            height: 100%;
            position: relative;
            /* transform:
                rotateX(-20deg)
                rotateY(20deg)
            ; */
        
            .cylinder {
                position: relative;
                --diameter: 2em;
                --radius: calc(var(--diameter) / 2);
                --depth: 2em;
                --side-count: inherit;
                width: var(--diameter);
                height: var(--depth);
                outline: 1px solid lime;
                top: calc(50% - var(--diameter) / 2);
                left: calc(50% - var(--diameter) / 2);
                transform-style: preserve-3d;
                animation: rotateEverywhere 5s linear infinite;

                .side {
                    position: absolute;
                    --side-i: inherit;
                    height: var(--depth);
                    --side-width: calc(var(--diameter) / calc(var(--side-count) / 3));
                    width: var(--side-width);
                    left: calc(50% - var(--side-width) / 2);
                    background:
                        linear-gradient(to top, #1112, #1110),
                        hsl(
                            calc(255 * var(--side-i) / var(--side-count)),
                            75%,
                            75%
                        );
                    --angle-multiple: calc(calc(var(--side-i) - 0.5) / var(--side-count));
                    --angle: calc(var(--angle-multiple) * 360deg);
                    /* --angle: calc(var(--side-i) / var(--side-count) * 360deg); */
                    
                    /* this --formed-gap variable is actually a compensation for a gap
                    that I kept getting between sides when I just used translateZ(var(--radius))...!
                    I don't know if this is a good thing to do
                    or if it will apply to cylinders of any size and side count!
                    */
                    --formed-gap: calc(var(--side-count) * 1px / 3);

                    transform:
                    rotateY(var(--angle))
                    translateZ(calc(var(--radius) - var(--formed-gap)))
                    ;
                }

            }
        }
        @keyframes rotateEverywhere {
            0%, 100% {
                transform: rotate3d(0deg, 0deg, 0deg);
            }
            25% {
                transform: rotate3d(90deg, 0deg, 0deg);
            }
            50% {
                transform: rotate3d(0deg, 90deg, 0deg);
            }
            75% {
                transform: rotate3d(0deg, 0deg, 90deg);
            }
        }
    </style>
    <div class="scene-container">
        <div class="scene">
            <div class="cylinder" style="--side-count: 18">
                <div class="side" style="--side-i: 1"></div>
                <div class="side" style="--side-i: 2"></div>
                <div class="side" style="--side-i: 3"></div>
                <div class="side" style="--side-i: 4"></div>
                <div class="side" style="--side-i: 5"></div>
                <div class="side" style="--side-i: 6"></div>
                <div class="side" style="--side-i: 7"></div>
                <div class="side" style="--side-i: 8"></div>
                <div class="side" style="--side-i: 9"></div>
                <div class="side" style="--side-i: 10"></div>
                <div class="side" style="--side-i: 11"></div>
                <div class="side" style="--side-i: 12"></div>
                <div class="side" style="--side-i: 13"></div>
                <div class="side" style="--side-i: 14"></div>
                <div class="side" style="--side-i: 15"></div>
                <div class="side" style="--side-i: 16"></div>
                <div class="side" style="--side-i: 17"></div>
                <div class="side" style="--side-i: 18"></div>
            </div>
        </div>
    </div>
</body>
</html>
