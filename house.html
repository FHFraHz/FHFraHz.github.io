<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/web/css-gallery/house.css">
    <title>House: 2nd Version</title>
</head>
<body>
    <style>
        body {
            width: 100vw;
            width: 100svw;
            height: 100vh;
            height: 100svh;
            margin: 0;
            padding: 0;
        }
    </style>
    <div class="scene-container" style="--perspective-font-size: 96px">
        <div class="scene">
            <div class="grass"></div>
            <div class="house">
                <div class="house-side front">
                    <div class="windows">
                        <div class="window square left"></div>
                        <div class="window round upstairs"></div>
                    </div>
                    <div class="door frontdoor"></div>
                </div>
                <div class="house-side left">
                    <div class="windows">
                        <div class="window square center"></div>
                    </div>
                </div>
                <div class="house-side right">
                    <div class="windows">
                        <div class="window square left"></div>
                        <div class="window square right"></div>
                    </div>
                </div>
                <div class="house-side back">
                    <div class="windows">
                        <div class="window round upstairs"></div>
                        <div class="window square right"></div>
                    </div>
                    <div class="door backdoor">
                        <div class="window"></div>
                    </div>
                </div>
                <div class="house-side bottom"></div>
                <div class="roof-side left"></div>
                <div class="roof-side right"></div>            
            </div>
            <div class="tree" style="--tree-side-count: 10">
                <div class="tree-side" style="--tree-side: 1"></div>
                <div class="tree-side" style="--tree-side: 2"></div>
                <div class="tree-side" style="--tree-side: 3"></div>
                <div class="tree-side" style="--tree-side: 4"></div>
                <div class="tree-side" style="--tree-side: 5"></div>
                <div class="tree-side" style="--tree-side: 6"></div>
                <div class="tree-side" style="--tree-side: 7"></div>
                <div class="tree-side" style="--tree-side: 8"></div>
                <div class="tree-side" style="--tree-side: 9"></div>
                <div class="tree-side" style="--tree-side: 10"></div>
                <div class="trunk"></div>
            </div>
